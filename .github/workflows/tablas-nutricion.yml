name: Tablas de nutrición

# Baja la tabla de composición de alimentos de USDA FoodData Central desde la
# fuente oficial y deja en el repo solo lo que Rinde usa.
#
# Existe por la misma razón que el build de Android (D26): la política de red
# del contenedor de desarrollo deniega fdc.nal.usda.gov, www.icbf.gov.co y
# www.fao.org. Los runners de GitHub sí llegan. Así la tabla sale de la fuente
# primaria y queda con su huella, en vez de transcribirse de memoria.
#
# Reglas:
#   - El enlace de descarga NO se escribe a mano: se descubre en la página
#     oficial de descargas. Si la página cambia y no aparece, el job falla.
#   - Se guarda el SHA-256 de cada archivo descargado.
#   - La nota de licencia se copia de la propia página, no se afirma.

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/tablas-nutricion.yml"
      - "scripts/tablas/**"
  workflow_dispatch:

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Descubrir los enlaces en la página oficial de descargas
        id: enlaces
        run: |
          set -euo pipefail
          mkdir -p work
          curl -sSL --fail -A "rinde-tablas/1.0" -o work/pagina.html \
            https://fdc.nal.usda.gov/download-datasets
          # Todos los .zip de CSV que la página enlaza, para el registro.
          grep -oiE 'href="[^"]+\.zip"' work/pagina.html | sed -E 's/^href="//I; s/"$//' \
            | sort -u > work/enlaces.txt
          echo "--- enlaces .zip en la página ---"; cat work/enlaces.txt

          absoluto() { case "$1" in http*) echo "$1";; /*) echo "https://fdc.nal.usda.gov$1";; *) echo "https://fdc.nal.usda.gov/$1";; esac; }

          SR=$(grep -iE 'sr_legacy.*csv.*\.zip$' work/enlaces.txt | sort | tail -n1 || true)
          FF=$(grep -iE 'foundation.*csv.*\.zip$' work/enlaces.txt | sort | tail -n1 || true)
          if [ -z "$SR" ]; then echo "ERROR: no se encontró el CSV de SR Legacy en la página"; exit 1; fi
          echo "sr=$(absoluto "$SR")" >> "$GITHUB_OUTPUT"
          echo "ff=$( [ -n "$FF" ] && absoluto "$FF" || echo "")" >> "$GITHUB_OUTPUT"

          # Lo que la página dice sobre licencia, textual, para citarlo y no suponerlo.
          python3 - <<'PYEOF'
          import re, html
          t = open("work/pagina.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"<script.*?</script>|<style.*?</style>", " ", t, flags=re.S | re.I)
          t = html.unescape(re.sub(r"<[^>]+>", " ", t))
          t = re.sub(r"\s+", " ", t)
          frases = set()
          for m in re.finditer(r"(public domain|CC0|Creative Commons|license|licen)", t, re.I):
              frases.add(t[max(0, m.start()-220): m.end()+220].strip())
          open("work/licencia.txt", "w", encoding="utf-8").write("\n\n---\n\n".join(sorted(frases)) or "(la página no menciona licencia)")
          PYEOF
          echo "--- licencia según la página ---"; cat work/licencia.txt

      - name: Descargar y extraer
        run: |
          set -euo pipefail
          mkdir -p packages/data/tablas/usda
          SALIDA=packages/data/tablas/usda
          : > work/huellas.txt
          bajar() {
            local url="$1" nombre="$2" etiqueta="$3"
            curl -sSL --fail -A "rinde-tablas/1.0" -o "work/$nombre.zip" "$url"
            local sha; sha=$(sha256sum "work/$nombre.zip" | cut -d' ' -f1)
            local bytes; bytes=$(stat -c %s "work/$nombre.zip")
            echo "$etiqueta|$url|$sha|$bytes" >> work/huellas.txt
            mkdir -p "work/$nombre" && unzip -q -o "work/$nombre.zip" -d "work/$nombre"
            python3 scripts/tablas/extraer_fdc.py "work/$nombre" "$SALIDA/$nombre.csv" "$etiqueta"
          }
          bajar "${{ steps.enlaces.outputs.sr }}" sr_legacy "SR Legacy"
          if [ -n "${{ steps.enlaces.outputs.ff }}" ]; then
            bajar "${{ steps.enlaces.outputs.ff }}" foundation "Foundation Foods"
          fi

          {
            echo "# Procedencia de estas tablas"
            echo
            echo "Generado por \`.github/workflows/tablas-nutricion.yml\`. No editar a mano."
            echo
            echo "- Descargado: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "- Página de origen: https://fdc.nal.usda.gov/download-datasets"
            echo "- Ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "| Conjunto | URL | SHA-256 del .zip | Bytes |"
            echo "|---|---|---|---|"
            while IFS='|' read -r e u s b; do echo "| $e | $u | \`$s\` | $b |"; done < work/huellas.txt
            echo
            echo "## Enlaces .zip que ofrecía la página"
            echo; sed 's/^/- /' work/enlaces.txt
            echo
            echo "## Lo que la página dice sobre licencia (textual)"
            echo; echo '```'; cat work/licencia.txt; echo; echo '```'
            echo
            echo "## Columnas"
            echo
            echo "Valores por 100 g. Un nutriente ausente queda vacío, no en cero."
            echo "\`energy_basis\` dice qué variante de energía se usó."
          } > "$SALIDA/FUENTE.md"
          cat "$SALIDA/FUENTE.md"
          wc -l "$SALIDA"/*.csv

      - name: Licencia de USDA según sus propias páginas
        continue-on-error: true
        run: |
          # La página de descargas no dice nada de licencia. Se buscan las
          # páginas del mismo sitio que la mencionen y se copia el texto tal
          # cual, para no afirmar una licencia de memoria.
          SALIDA=packages/data/tablas/usda/LICENCIA.md
          curl -sSL -A "rinde-tablas/1.0" -o work/fdc_home.html https://fdc.nal.usda.gov/ || true
          grep -oiE 'href="[^"#]+"' work/fdc_home.html | sed -E 's/^href="//I; s/"$//' \
            | grep -iE 'faq|about|licen|help|data-documentation|policy' | sort -u > work/fdc_candidatas.txt || true
          echo "# Licencia de USDA FoodData Central, según fdc.nal.usda.gov" > "$SALIDA"
          echo >> "$SALIDA"
          echo "Texto copiado de las páginas del propio sitio. Generado por CI; no editar a mano." >> "$SALIDA"
          while read -r rel; do
            case "$rel" in http*) url="$rel";; /*) url="https://fdc.nal.usda.gov$rel";; *) url="https://fdc.nal.usda.gov/$rel";; esac
            case "$url" in https://fdc.nal.usda.gov*) ;; *) continue;; esac
            curl -sSL -A "rinde-tablas/1.0" -o work/fdc_p.html "$url" || continue
            python3 - "$url" >> "$SALIDA" <<'PYEOF'
          import re, html, sys
          t = open("work/fdc_p.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"<script.*?</script>|<style.*?</style>", " ", t, flags=re.S | re.I)
          t = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", t)))
          hits = {t[max(0, m.start()-250): m.end()+250].strip()
                  for m in re.finditer(r"public domain|CC0|Creative Commons|copyright", t, re.I)}
          if hits:
              print(f"\n## {sys.argv[1]}\n")
              for h in sorted(hits): print(f"> {h}\n")
          PYEOF
          done < work/fdc_candidatas.txt
          cat "$SALIDA"

      - name: Tabla colombiana del ICBF — explorar y bajar solo lo que se ofrece como descarga
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          # La exploración anterior encontró en icbf.gov.co un enlace a
          # "Tabla de Composición de Alimentos Colombiana". Aquí se registra
          # qué hay en esa página y se bajan ÚNICAMENTE los archivos que la
          # página enlaza para descarga (pdf, xls, xlsx, csv, zip). No se
          # consulta la herramienta en línea alimento por alimento: eso sería
          # raspar el sitio, y el brief lo prohíbe.
          mkdir -p packages/data/tablas/icbf
          SALIDA=packages/data/tablas/icbf/EXPLORACION.md
          BASE="https://www.icbf.gov.co"
          PAG="$BASE/bienestar/nutricion/tabla-alimentos"
          code=$(curl -sSL -A "rinde-tablas/1.0" -o work/icbf_tabla.html -w "%{http_code}" "$PAG" || echo fallo)
          {
            echo "# Exploración de la tabla colombiana (ICBF)"
            echo
            echo "- Página: $PAG → HTTP $code"
            echo "- Fecha: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "## Título y texto visible (recortado)"
            echo
            python3 - <<'PYEOF'
          import re, html
          t = open("work/icbf_tabla.html", encoding="utf-8", errors="replace").read()
          titulo = re.search(r"<title>(.*?)</title>", t, re.S | re.I)
          print("Título:", html.unescape(titulo.group(1)).strip() if titulo else "(sin título)")
          c = re.sub(r"<script.*?</script>|<style.*?</style>|<nav.*?</nav>|<header.*?</header>|<footer.*?</footer>", " ", t, flags=re.S | re.I)
          c = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", c))).strip()
          print()
          print("```"); print(c[:3000]); print("```")
          PYEOF
            echo
            echo "## Enlaces de la página"
            echo
            grep -oiE 'href="[^"]+"' work/icbf_tabla.html | sed -E 's/^href="//I; s/"$//' | sort -u | sed 's/^/- /'
            echo
            echo "## Archivos descargables encontrados"
            echo
          } > "$SALIDA"
          # Solo archivos cuyo nombre es de la tabla o del estudio de composición.
          # La primera versión bajaba todos los PDF de la página y se trajo las
          # políticas de privacidad del pie de página.
          grep -oiE 'href="[^"]+\.(pdf|xlsx?|csv|zip)"' work/icbf_tabla.html | sed -E 's/^href="//I; s/"$//' \
            | grep -iE 'tcac|composici' | sort -u > work/icbf_archivos.txt || true
          if [ ! -s work/icbf_archivos.txt ]; then echo "(ninguno)" >> "$SALIDA"; fi
          while read -r rel; do
            case "$rel" in http*) url="$rel";; /*) url="$BASE$rel";; *) url="$BASE/$rel";; esac
            nombre=$(basename "${url%%\?*}")
            if curl -sSL --fail -A "rinde-tablas/1.0" -o "work/$nombre" "$url"; then
              sha=$(sha256sum "work/$nombre" | cut -d' ' -f1)
              bytes=$(stat -c %s "work/$nombre")
              nota=""
              # El PDF no se guarda en el repo (pesa 16 MB): se guarda su texto
              # con la maquetación conservada, para poder leer las filas de la
              # tabla y citarlas. La huella permite verificar contra el original.
              case "$nombre" in
                *.pdf|*.PDF)
                  { echo "  $nombre:"; pdfinfo "work/$nombre" | sed 's/^/    /'; } >> "$SALIDA.info" || true
                  # Si el propio PDF prohíbe copiar su contenido, no se extrae
                  # nada. pdftotext ignora ese permiso; Rinde no. Que se pueda
                  # técnicamente no quiere decir que esté permitido.
                  if pdfinfo "work/$nombre" | grep -qi 'copy:no'; then
                    nota=" → **el PDF prohíbe copiar su contenido (copy:no): no se extrajo nada**"
                  else
                    txt="packages/data/tablas/icbf/${nombre%.*}.txt"
                    pdftotext -layout "work/$nombre" "$txt" && nota=" → texto en \`$(basename "$txt")\`"
                  fi ;;
                *) cp "work/$nombre" "packages/data/tablas/icbf/$nombre" ;;
              esac
              echo "- \`$nombre\` — $url — SHA-256 \`$sha\` — $bytes bytes$nota" >> "$SALIDA"
            else
              echo "- $url — no se pudo descargar" >> "$SALIDA"
            fi
          done < work/icbf_archivos.txt
          if [ -f "$SALIDA.info" ]; then
            { echo; echo "## Metadatos de los PDF (pdfinfo)"; echo; echo '```'; cat "$SALIDA.info"; echo '```'; } >> "$SALIDA"
            rm "$SALIDA.info"
          fi
          cat "$SALIDA"
          rm -f packages/data/tablas/icbf_exploracion.txt

      - name: Guardar en el repo
        run: |
          set -euo pipefail
          git config user.name "rinde-tablas[bot]"
          git config user.email "rinde-tablas@users.noreply.github.com"
          git add packages/data/tablas
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Tablas de composición de USDA FoodData Central, bajadas de la fuente oficial" \
                     -m "Generado por .github/workflows/tablas-nutricion.yml (run ${GITHUB_RUN_ID})."
          # Si entre tanto llegó otro commit a la rama, se pone este encima.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
