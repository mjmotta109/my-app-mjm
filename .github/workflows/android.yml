name: Android

# Compila el APK de Android.
#
# Existe porque el contenedor de desarrollo no puede descargar el SDK de
# Android (la política de red del entorno bloquea dl.google.com), pero los
# runners de GitHub sí lo traen preinstalado. Así el build nativo se verifica
# de verdad en cada cambio, en vez de asumirse.
#
# El APK de depuración queda como artefacto descargable: sirve para instalar en
# un teléfono y probar, sin necesidad de Android Studio.

on:
  push:
    branches: ["**"]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      # Los tsconfig de la raíz gobiernan la compilación de todo el monorepo:
      # dejarlos fuera del filtro hizo que un arreglo de `typecheck` no
      # disparara el build que lo iba a verificar.
      - "tsconfig*.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Necesario para publicar el Release con el APK adjunto.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos y pruebas del motor
        run: |
          npm run typecheck
          npm test

      - name: Compilar la web en modo nativo
        # RINDE_TARGET=native apaga el service worker: dentro del APK los
        # archivos ya son locales y un SW solo serviría assets viejos tras
        # actualizar desde Play.
        run: npm run build:native

      - name: Aceptar licencias del SDK de Android
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Compilar el APK de depuración
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Comprobar que el APK existe y no está vacío
        run: |
          APK=apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "No se generó el APK"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "APK: $SIZE bytes"
          # Un APK de una app con 119 recetas embebidas no puede pesar 100 KB.
          test "$SIZE" -gt 1000000 || { echo "APK sospechosamente pequeño"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: rinde-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Los artefactos de Actions caducan a los 14 días, vienen en un .zip y
      # exigen iniciar sesión en GitHub. Para instalar en un teléfono eso es
      # incómodo, así que el mismo APK se publica en un Release con una etiqueta
      # fija: queda un enlace directo, estable y sin login.
      - name: Publicar el APK de prueba en un Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA_CORTO=$(git rev-parse --short HEAD)
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk rinde-preview.apk

          # La etiqueta es móvil: siempre apunta al último build de prueba. Se
          # borra y se recrea para que el tag siga al commit actual.
          gh release delete preview-apk --yes --cleanup-tag 2>/dev/null || true

          gh release create preview-apk rinde-preview.apk \
            --target "$GITHUB_SHA" \
            --title "Rinde — APK de prueba" \
            --prerelease \
            --notes "$(cat <<NOTAS
          **Build de prueba de Rinde.** Commit \`${SHA_CORTO}\`.

          ### Instalar en Android

          1. Abre este enlace desde el celular y descarga \`rinde-preview.apk\`.
          2. Android va a avisar que la app viene de un origen desconocido.
             Acepta instalar desde el navegador: es normal, el APK está firmado
             con la llave de depuración, no con una de Play.
          3. Ábrela. No pide cuenta ni conexión.

          ### Qué tener en cuenta

          - **Los precios son de demostración**, marcados como tales dentro de la
            app. No son precios reales de mercado.
          - Es un build de **depuración**, no de producción: sin optimizar y
            firmado con la llave de debug.
          - Todo se guarda solo en tu teléfono. Para borrarlo: Perfil → Borrar
            todos mis datos.

          Este Release se reemplaza en cada build, así que el enlace siempre trae
          la versión más reciente.
          NOTAS
          )"

          echo "Release publicado:"
          gh release view preview-apk --json url,assets \
            --jq '.url, (.assets[] | "  " + .name + " — " + (.size|tostring) + " bytes — " + .url)'

